<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instagram Follow Checker 😎📉</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: black;
    color: #ddd;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.container {
    width: 800px;
    max-width: 90%;
    background: rgba(40,40,40,0.9);
    padding: 20px;
    border-radius: 8px;
}
h1 {
    color: #0f0;
    text-align: center;
}
label, button {
    width: 100%;
    display: block;
    margin-top: 10px;
    padding: 10px;
    background: #444;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    text-align: center;
}
label:hover, button:hover {
    background: #666;
}
input[type="file"] {
    display: none;
}
.results {
    margin-top: 20px;
    background: #222;
    padding: 10px;
    border-radius: 5px;
    display: none;
}
.results ul {
    list-style: none;
    padding: 0;
}
.results li {
    margin: 5px 0;
}
.results a {
    color: #1e90ff;
    text-decoration: none;
}
</style>
</head>

<body>
<div class="container">
    <h1>Instagram Follow Checker 😎📉</h1>

    <label for="followersFile" id="followersLabel">Choose Followers file 📁</label>
    <input type="file" id="followersFile" accept=".json">

    <label for="followingFile" id="followingLabel">Choose Following file 📁</label>
    <input type="file" id="followingFile" accept=".json">

    <button onclick="checkFollowers()">Check Now 🚀</button>

    <div class="results" id="results"></div>
</div>

<script>
function updateLabel(inputId, labelId) {
    const input = document.getElementById(inputId);
    const label = document.getElementById(labelId);
    input.addEventListener("change", () => {
        label.textContent = input.files[0]?.name || "Choose file 📁";
    });
}

updateLabel("followersFile", "followersLabel");
updateLabel("followingFile", "followingLabel");

function readFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            try {
                resolve(JSON.parse(reader.result));
            } catch {
                reject();
            }
        };
        reader.readAsText(file);
    });
}

function extractUsersFromFollowers(data) {
    const users = new Set();
    data.forEach(entry => {
        entry.string_list_data.forEach(item => {
            users.add(item.value);
        });
    });
    return users;
}

function extractUsersFromFollowing(data) {
    const users = new Set();
    data.forEach(entry => {
        entry.string_list_data.forEach(item => {
            users.add(entry.title);
        });
    });
    return users;
}

async function checkFollowers() {
    const followersFile = document.getElementById("followersFile").files[0];
    const followingFile = document.getElementById("followingFile").files[0];

    if (!followersFile || !followingFile) {
        alert("Upload both files");
        return;
    }

    const followersData = await readFile(followersFile);
    const followingData = await readFile(followingFile);

    const followers = extractUsersFromFollowers(followersData);
    const following = extractUsersFromFollowing(followingData.relationships_following);

    const notBack = [...following].filter(u => !followers.has(u));

    const results = document.getElementById("results");
    results.style.display = "block";

    if (!notBack.length) {
        results.innerHTML = "<p>Everyone follows you back 🎉</p>";
        return;
    }

    results.innerHTML =
        "<h2>Not following you back 🚫</h2><ul>" +
        notBack.map(u =>
            `<li><a href="https://instagram.com/${u}" target="_blank">${u}</a></li>`
        ).join("") +
        "</ul>";
}
</script>
</body>
</html>
